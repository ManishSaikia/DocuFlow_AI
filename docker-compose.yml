services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docuflow_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: docuflow_user
      POSTGRES_PASSWORD: "m!MHsn660<"
      POSTGRES_DB: docuflow_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U docuflow_user -d docuflow_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docuflow_redis

    restart: unless-stopped
    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: docuflow_jaeger
    restart: unless-stopped
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver

volumes:
  postgres_data:
  redis_data:
