name: AI RAG Regression Gate & Evals

on:
  pull_request:
    paths:
      - "backend/app/agents/**"
      - "backend/app/services/**"
      - "backend/test/evals/**"
      - ".github/workflows/ai-evals.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rag-regression-gate:
    name: RAG Triad Regression Benchmark
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docuflow_user
          POSTGRES_PASSWORD: docuflow_secure_password
          POSTGRES_DB: docuflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      ENVIRONMENT: "testing"
      PROJECT_NAME: "DocuFlow AI"
      POSTGRES_SERVER: "localhost"
      POSTGRES_PORT: 5432
      POSTGRES_USER: "docuflow_user"
      POSTGRES_PASSWORD: "docuflow_secure_password"
      POSTGRES_DB: "docuflow_db"
      REDIS_HOST: "localhost"
      REDIS_PORT: 6379
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: "openai/gpt-oss-120b"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache HuggingFace & FastEmbed Models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/fastembed
          key: ${{ runner.os }}-models-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-models-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Initialize PostgreSQL pgvector Schema
        working-directory: ./backend
        run: |
          python -m app.db.init_db

      - name: Seed Golden Test Document
        working-directory: ./backend
        run: |
          python -m test.evals.seed_test_db

      - name: Execute RAG Triad Regression Suite
        working-directory: ./backend
        run: |
          pytest test/evals/test_rag_pipeline.py -v -s

